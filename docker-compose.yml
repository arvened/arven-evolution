services:
  arven:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    # To enable document review, create fusion.config.json from fusion.config.example.json
    # and uncomment the two lines below.
    # volumes:
    #   - ./fusion.config.json:/app/fusion.config.json:ro
    restart: unless-stopped
